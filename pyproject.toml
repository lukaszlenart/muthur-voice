[project]
name = "muthur-voice"
version = "0.1.0"
description = "MU/TH/UR terminal intro videos with Polish narration for Alien RPG sessions"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.3.1",
    "pillow>=12.0",
]

[project.optional-dependencies]
align = ["faster-whisper>=1.2", "av<19"]

[project.scripts]
muthur = "muthur.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "muthur"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["golden: pixel-exact comparison with the recorded prototype output (slow, needs Menlo)"]

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { edge-tts = false }
